<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Document Assistant</title>

    <!-- External libs -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js" defer></script>
    <script type="module" src="https://md-block.verou.me/md-block.js"></script>
    <script src="/static/lib/apryse/webviewer.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/fuzzysort@2.0.1/fuzzysort.js"></script>
    <!-- App CSS -->
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>

    <!-- Application shell (logic lives in /static/scripts.js) -->
    <div id="custom-cursor"></div>
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <div id="loadingText" class="loading-text">Loading Interface...</div>
    </div>

    <div id="authScreen" class="auth-container">
      <div class="auth-card" data-cool-fx>
        <h1 class="auth-title">RAG Assistant</h1>
        <div id="loginForm">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="Enter your email" />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" />
          </div>
          <button id="loginBtn" class="auth-button">Sign In</button>
          <div class="auth-switch">Don't have an account? <button id="showSignup">Sign Up</button></div>
        </div>
        <div id="signupForm" style="display: none">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="signupEmail" class="form-input" placeholder="Enter your email" />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="signupPassword" class="form-input" placeholder="Create a password" />
          </div>
          <button id="signupBtn" class="auth-button">Sign Up</button>
          <div class="auth-switch">Already have an account? <button id="showLogin">Sign In</button></div>
        </div>
      </div>
    </div>

    <div id="appContainer" class="app-container">
      <div class="header" data-cool-fx>
        <div class="logo">RAG Assistant</div>
        <div class="header-actions">
          <div class="stacked-buttons">
            <button id="addDocsBtn" class="btn btn-secondary" style="display: none">Add Docs</button>
            <button id="newSessionBtn" class="btn btn-primary">New Session</button>
          </div>
          <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>
      </div>

      <div class="main-content">
        <div id="sidebar" class="sidebar" data-cool-fx>
          <div class="sidebar-header">
            <h3 class="sidebar-title">Sessions</h3>
          </div>
          <div id="sessionsList" class="sessions-list"></div>
        </div>

        <button id="sidebarToggleBtn" title="Toggle Sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
          </svg>
        </button>

        <div class="viewer-container" data-cool-fx>
          <div id="viewerArea" class="viewer-area">
            <div id="uploadArea" class="upload-area" style="display: none">
              <div class="upload-icon">File</div>
              <div class="upload-text">Drag & drop files or upload to get started</div>
              <label for="fileInput" class="upload-btn">Choose Files</label>
              <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.pptx,.docx,.xlsx,.csv,.txt,.md,.png,.jpg,.jpeg,.py,.js,.html,.css,.java,.json" />
              <div style="margin: 1rem 0; color: #9ca3af">or</div>
              <input type="url" id="urlInput" class="url-input" placeholder="Enter document URL" />
              <button id="uploadUrlBtn" class="upload-btn">Upload URL</button>
            </div>
            <div id="apryseViewer" style="height: 100%"></div>
          </div>

          <div id="chatPanel" class="chat-panel" style="display: none" data-cool-fx>
            <div class="chat-header">
              <div class="chat-title">Chat</div>
              <div class="chat-controls">
                <button id="toggleSpeechBtn" class="chat-control-btn active" title="Toggle Speech Output">
                  <svg class="speaker-on" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                  <svg class="speaker-off" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                </button>
                <button id="minimizeChatBtn" class="chat-control-btn" title="Minimize">—</button>
                <button id="restoreChatBtn" class="chat-control-btn" title="Restore">&#9633;</button>
                <button id="closeChatBtn" class="chat-control-btn" title="Close">✕</button>
              </div>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
              <div class="chat-input-group">
                <textarea id="chatInput" class="chat-input" placeholder="Ask a question..."></textarea>
                <button id="settingsBtn" class="send-btn" title="Voice Settings" style="padding: 0.75rem; background: rgba(75, 85, 99, 0.5)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                  </svg>
                </button>
                <button id="micBtn" class="send-btn" title="Toggle Voice Commands" style="padding: 0.75rem">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="22"></line>
                  </svg>
                </button>
                <button id="sendBtn" class="send-btn">Send</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="addDocsModal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <button id="closeModalBtn" class="modal-close-btn" title="Close">&times;</button>
        <h2>Add Documents to Session</h2>
        <div class="upload-area-content">
          <label for="modalFileInput" class="upload-btn">Choose Files</label>
          <input type="file" id="modalFileInput" class="file-input" multiple accept=".pdf,.pptx,.docx,.xlsx,.csv,.txt,.md,.png,.jpg,.jpeg,.py,.js,.html,.css,.java,.json" />
          <div style="margin: 1rem 0; color: #9ca3af">or</div>
          <input type="url" id="modalUrlInput" class="url-input" placeholder="Enter document URL" />
          <button id="modalUploadUrlBtn" class="upload-btn">Upload URL</button>
        </div>
      </div>
    </div>

    <script defer src="/static/scripts.js"></script>
  </body>
</html>
